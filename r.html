<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Random Team</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <section class="screen screen-center">
      <div id="state-ready" hidden>
        <p class="muted">Make sure nobody else can see your screen.</p>
        <button id="reveal-btn" type="button" class="btn btn-primary btn-xl">Show my pair</button>
      </div>
      <div id="state-shown" hidden>
        <p class="muted">You are paired with</p>
        <p class="big-name secret" id="name"></p>
        <button id="hide-btn" type="button" class="btn btn-xl">Hide</button>
        <p class="muted small">Keep this link to see it again later.</p>
      </div>
      <div id="state-error" hidden>
        <h1>Random Team</h1>
        <p id="error-msg"></p>
      </div>
    </section>
  </main>
  <script src="js/core.js"></script>
  <script src="js/reveal.js"></script>
</body>
</html>
