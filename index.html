<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Random Team</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">

    <!-- 1. Setup: the operator enters the names -->
    <section id="screen-setup" class="screen">
      <header class="top">
        <div>
          <h1>Random Team</h1>
          <p class="muted" data-i18n="tagline">Secretly pair everyone in a list with someone else.</p>
        </div>
        <div class="lang" role="group" data-i18n-aria-label="langLabel">
          <button type="button" data-lang="en" lang="en">EN</button>
          <button type="button" data-lang="fr" lang="fr">FR</button>
        </div>
      </header>

      <form id="add-form" class="row" autocomplete="off">
        <label class="sr-only" for="name-input" data-i18n="nameLabel">Name</label>
        <input id="name-input" type="text" data-i18n-placeholder="addPlaceholder" placeholder="Add a name…" enterkeyhint="done" autocapitalize="words">
        <button type="submit" class="btn" data-i18n="add">Add</button>
      </form>
      <p id="add-error" class="error" role="alert" hidden></p>

      <div class="list-head">
        <h2 id="name-count">0 participants</h2>
        <button id="clear-btn" type="button" class="btn-link" data-i18n="clearList" hidden>Clear list</button>
      </div>
      <ol id="name-list" class="names"></ol>
      <p id="empty-hint" class="muted" data-i18n="emptyHint"></p>

      <fieldset class="toggle-group">
        <legend data-i18n="revealLegend">How participants see their pair</legend>
        <div class="toggle" role="radiogroup">
          <label><input type="radio" name="reveal" value="screen" checked><span data-i18n="revealScreen">On this screen</span></label>
          <label><input type="radio" name="reveal" value="qr"><span data-i18n="revealQr">QR code / link</span></label>
        </div>
        <p id="reveal-help" class="muted small"></p>
        <p id="file-warning" class="warn" data-i18n="fileWarning" hidden></p>
      </fieldset>

      <details class="options">
        <summary data-i18n="moreOptions">More options</summary>
        <fieldset>
          <legend data-i18n="modeLegend">Pairing style</legend>
          <label><input type="radio" name="mode" value="any" checked> <span data-i18n="modeAny"></span></label>
          <label><input type="radio" name="mode" value="loop"> <span data-i18n="modeLoop"></span></label>
        </fieldset>
      </details>

      <button id="start-btn" type="button" class="btn btn-primary btn-block" data-i18n="start" disabled>Start the draw</button>
      <p id="start-hint" class="muted center"></p>
    </section>

    <!-- 2. Hand-out: the operator picks who's next -->
    <section id="screen-handout" class="screen" hidden>
      <header>
        <h1 data-i18n="handoutTitle">Draw done</h1>
        <p class="muted"><span data-i18n="handoutHelp"></span><br><strong id="progress"></strong></p>
      </header>
      <div id="people" class="people"></div>
      <div id="all-done" class="done-box" hidden>
        <p><strong data-i18n="allDone"></strong></p>
        <p class="muted" data-i18n="volatileNote"></p>
      </div>
      <button id="end-btn" type="button" class="btn btn-block"></button>
    </section>

    <!-- 3. Hand-over: confirm the participant holds the device -->
    <section id="screen-handover" class="screen screen-center" hidden>
      <p class="muted" data-i18n="handoverTo">Hand the device to</p>
      <p class="big-name" id="handover-name"></p>
      <p class="muted" data-i18n="handoverPrivacy"></p>
      <button id="show-btn" type="button" class="btn btn-primary btn-xl"></button>
      <button id="handover-cancel" type="button" class="btn-link" data-i18n="notMe"></button>
    </section>

    <!-- 4. Reveal -->
    <section id="screen-reveal" class="screen screen-center" hidden>
      <p class="muted" id="reveal-intro"></p>
      <div id="reveal-screen">
        <p class="big-name secret" id="reveal-name"></p>
      </div>
      <div id="reveal-qr" hidden>
        <div id="qr" class="qr" role="img" data-i18n-aria-label="qrAlt"></div>
        <p class="muted small"><span data-i18n="scanHelp"></span><br><span data-i18n="noCamera"></span></p>
        <p class="code small" id="qr-link"></p>
      </div>
      <button id="hide-btn" type="button" class="btn btn-primary btn-xl" data-i18n="hideBtn">Hide &amp; hand back</button>
    </section>

  </main>

  <script src="vendor/qrcode.js"></script>
  <script src="js/core.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
